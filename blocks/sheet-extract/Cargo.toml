[package]
name = "cf-block-sheet-extract"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reads XLSX/XLSM/XLS workbooks into JSON rows, in the guest"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cuttlefish-sdk = { workspace = true }
serde_json = { workspace = true }
base64 = "0.23"
# default-features = false keeps this off the host filesystem APIs that do
# not exist on wasm32-unknown-unknown. Verified to build for that target
# before this block was written -- it is the whole reason a spreadsheet
# reader can live in the guest rather than behind a host feature flag.
calamine = { version = "0.36", default-features = false, features = ["dates"] }
