[package]
name = "cuttlefishd"
description = "The cuttlefish daemon: accepts delegated jobs, runs them, streams results"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "cuttlefishd"
path = "src/lib.rs"

[[bin]]
name = "cuttlefishd"
path = "src/main.rs"

[features]
default = []
# Pass-through so `cargo build -p cuttlefishd --features llamacpp` works without
# the caller having to know which crate actually owns the feature.
llamacpp = ["cuttlefish-host/llamacpp"]

[dependencies]
cuttlefish-abi = { workspace = true }
cuttlefish-core = { workspace = true }
cuttlefish-host = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["signal", "fs"] }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
wasmtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
reqwest = { workspace = true }
