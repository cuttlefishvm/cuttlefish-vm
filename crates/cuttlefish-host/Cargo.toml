[package]
name = "cuttlefish-host"
description = "Wasmtime host that drives cuttlefish proc-blocks and enforces capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
# Embeds llama.cpp. Off by default: llama-cpp-sys-2 compiles llama.cpp from
# source, which needs cmake, a C++ toolchain, and libclang for bindgen. Nothing
# else in the workspace changes when it is absent — the backend registry simply
# does not offer the `llamacpp` provider.
llamacpp = ["dep:llama-cpp-2", "dep:encoding_rs", "dep:image"]
# Rasterizing PDF pages for vision models. Off by default: pdfium is a large
# native dependency, and text extraction (always available) covers documents
# that have a text layer.
pdf-render = ["dep:pdfium-render", "dep:image"]

# Only built with the feature that needs it; see render_worker.
[[bin]]
name = "cuttlefish-render-worker"
path = "src/bin/cuttlefish-render-worker.rs"
required-features = ["pdf-render"]

[dependencies]
cuttlefish-abi = { workspace = true }
cuttlefish-core = { workspace = true }
wasmtime = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
llama-cpp-2 = { version = "0.1.153", optional = true, features = ["mtmd"] }
# Only for llama.cpp's stateful token decoder; see llamacpp.rs.
encoding_rs = { version = "0.8", optional = true }
async-trait = "0.1"
reqwest = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
# sha2: content-hashing for the catalog's blob store, wired in starting in Task 7.
# time: RFC 3339 timestamps for the catalog's created_at field, wired in starting in Task 9.
sha2 = { workspace = true }
time = { workspace = true }
dirs = { workspace = true }
base64 = "0.22"
# Document reading. Pure Rust and always on — extraction is the cheap path that
# works with any text model.
lopdf = "0.44"
pdf-extract = "0.12"
# Pinned to a pdfium API version rather than `latest`. pdfium is loaded at
# runtime, so the crate's expected symbol set has to be no newer than the
# library actually present — nixpkgs ships 7749, and `latest` looks for symbols
# that build does not export, failing with a bare "symbol not found" at the
# first render. 7543 is the newest option at or below it.
pdfium-render = { version = "0.9", optional = true, default-features = false, features = [
    "pdfium_7543",
    "image_latest",
    "thread_safe",
] }
image = { version = "0.25", optional = true }

[dev-dependencies]
tempfile = "3"
wat = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"
