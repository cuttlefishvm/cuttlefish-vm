version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Hammer links this repo, and its libduckdb-sys needs arrow 58. Arrow 59
      # would break that link, so the arrow family moves only jointly with
      # DuckDB, by hand. Remove this rule when DuckDB moves to arrow 59.
      - dependency-name: arrow
        versions: [">=59"]
      - dependency-name: arrow-array
        versions: [">=59"]
      - dependency-name: arrow-schema
        versions: [">=59"]
      - dependency-name: parquet
        versions: [">=59"]
      # llama-cpp-2 after 0.1.154 removed AddBos, str_to_token, is_eog_token
      # and token_to_piece, which cuttlefish-host calls (PR #101's llama.cpp
      # job). Hold it until someone migrates the host to the new API by hand.
      - dependency-name: llama-cpp-2
        versions: [">0.1.154"]
      # calamine 0.36 and 0.38 pull a getrandom 0.4 that does not build for the
      # sheet-extract wasm block without a wasm backend (PR #89). Hold it until
      # the block enables that backend.
      - dependency-name: calamine
        versions: [">=0.35"]
    groups:
      # One PR for routine patch/minor bumps; majors still arrive separately
      # because those are the ones that need a human to read a changelog.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # `dtolnay/rust-toolchain@1.94.0` in the msrv job is not a dependency
      # version — it IS the minimum supported Rust version, deliberately pinned
      # to `rust-version` in the workspace Cargo.toml. Auto-bumping it would
      # leave the job green while testing the wrong compiler, which is precisely
      # the breakage the job exists to catch. Raise it by hand, together with
      # Cargo.toml, or not at all. (Dependabot proposed exactly this bump on the
      # repo's first day.)
      - dependency-name: dtolnay/rust-toolchain
