name: Release

# Publishes the workspace to crates.io when a version tag is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Publishing is irreversible: a crates.io version can be yanked but never
# replaced or deleted. So this workflow is deliberately tag-triggered rather
# than running on every merge to main, and it verifies everything it can before
# the first irreversible call.
#
# Requires a CRATES_IO_TOKEN secret:
#   cargo login                # to get a token from https://crates.io/settings/tokens
#   gh secret set CRATES_IO_TOKEN --repo cuttlefishvm/cuttlefish-vm

on:
  push:
    tags:
      - "v*"
  # Dry-run on demand: exercises the whole workflow except the publish itself.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # The tag is the source of truth for the version, but Cargo.toml is what
      # actually gets published. If they disagree, the tag is a lie — catch it
      # here rather than after publishing a version nobody can retract.
      - name: Verify tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match workspace version $manifest"
            exit 1
          fi

      # A crate that does not build cannot be unpublished, so re-run the gates
      # here rather than trusting that main was green when the tag was cut.
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Catches the packaging-specific failures that a normal build does not:
      # files missing from the published tarball, path dependencies without
      # versions, invalid metadata.
      # Only the leaf crate can be dry-run before its dependencies exist on
      # crates.io — a dry run of a dependent tries to resolve siblings from the
      # registry, where this version is not published yet. So this checks what it
      # can; the ordered loop below is what proves the rest, on the real run.
      - name: Package check
        run: cargo publish --dry-run -p cuttlefish-abi --locked

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Order matters and is not automatic: crates.io resolves a package's
          # dependencies at publish time, so a crate cannot go up before the
          # crates it names. This list is in dependency order — keep it that way
          # when adding crates, and note what depends on what:
          #
          #   cuttlefish-abi   -> (none)
          #   cuttlefish-core  -> (none)
          #   cuttlefish-sdk   -> abi
          #   cuttlefish-host  -> core (abi later)
          #   cuttlefishd      -> abi, core, host
          #   cuttlefish       -> abi, core        (the facade; published last)
          #
          # cf-block-echo-summarize is absent deliberately: it is a test fixture
          # and carries `publish = false`.
          for crate in \
            cuttlefish-abi \
            cuttlefish-core \
            cuttlefish-sdk \
            cuttlefish-host \
            cuttlefishd \
            cuttlefish
          do
            echo "::group::publishing $crate"
            # Tolerate a version already on crates.io, so re-running a
            # partially-failed release resumes rather than dying on step one.
            if cargo publish -p "$crate" --locked; then
              echo "$crate published"
            else
              echo "::warning::$crate did not publish — already at this version?"
            fi
            # crates.io's index is not immediately consistent: the next crate in
            # this list may depend on the one just published and fail to resolve
            # it. `cargo publish` waits for the index by default, but a short
            # settle keeps a fast runner from racing ahead of propagation.
            sleep 15
            echo "::endgroup::"
          done

  # Cuts the GitHub Release once, before any binary uploads race to create it.
  # Binary jobs below only ever upload assets to an already-existing release.
  #
  # Created as a *draft*, deliberately: GitHub's immutable-releases feature
  # locks a published release's assets the instant it's created, so a
  # published-on-creation release can never receive the binary uploads the
  # jobs below need to add afterward. A draft stays mutable. `publish-release`
  # (after every binary has uploaded) is what actually publishes it.
  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release if it does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes --draft
          fi

  # Prebuilt `cuttlefish` (CLI) and `cuttlefishd` (daemon) binaries, so using
  # this project doesn't require a Rust toolchain. Built without the
  # `llamacpp`/`pdf-render` features: both pull in a native C/C++ toolchain
  # (cmake, clang, or a pinned libpdfium) that isn't uniformly available
  # across this matrix's runners — the same default-feature build the `test`
  # job above already exercises on all three OSes.
  #
  # Every target here is a *native* build on its runner's own architecture
  # except x86_64-apple-darwin, cross-compiled from the arm64 macos-latest
  # runner — the standard way to produce an Intel Mac binary today, using the
  # x86_64 slice of the same Xcode SDK already on the runner.
  release-binaries:
    name: Build release binaries (${{ matrix.target }})
    needs: create-release
    # By default a job with `needs:` is skipped when the needed job is
    # skipped, not only when it fails — so on a workflow_dispatch dry run
    # (create-release skips itself via its own `if:`), this job would skip
    # too and never actually prove the cross-compilation matrix builds. This
    # `if:` explicitly allows both outcomes: proceed when create-release
    # succeeded (real tag push) or was skipped (dry run) — only propagate an
    # actual failure. The upload step below is separately gated to real tag
    # pushes, so a dry run still builds and packages every target without
    # uploading anything.
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p cuttlefish -p cuttlefishd

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_REF_NAME is the tag ("v0.1.0") on a real release, but on
          # a workflow_dispatch dry run it is the branch name instead, which
          # can contain a "/" (e.g. "feat/block-catalog") that breaks mkdir
          # below if left in — sanitize it out either way.
          version="${GITHUB_REF_NAME#v}"
          version="${version//\//-}"
          name="cuttlefish-${version}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/cuttlefish" "$name/"
          cp "target/${{ matrix.target }}/release/cuttlefishd" "$name/"
          cp README.md LICENSE_MIT.md LICENSE_APACHE.md "$name/"
          tar czf "${name}.tar.gz" "$name"
          echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_REF_NAME is the tag ("v0.1.0") on a real release, but on
          # a workflow_dispatch dry run it is the branch name instead, which
          # can contain a "/" (e.g. "feat/block-catalog") that breaks mkdir
          # below if left in — sanitize it out either way.
          version="${GITHUB_REF_NAME#v}"
          version="${version//\//-}"
          name="cuttlefish-${version}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/cuttlefish.exe" "$name/"
          cp "target/${{ matrix.target }}/release/cuttlefishd.exe" "$name/"
          cp README.md LICENSE_MIT.md LICENSE_APACHE.md "$name/"
          7z a "${name}.zip" "$name" >/dev/null
          echo "ASSET=${name}.zip" >> "$GITHUB_ENV"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        # Explicit, because this step's `$VAR`-style interpolation is bash
        # syntax — the Windows runner's default shell for `run:` is pwsh,
        # where `$GITHUB_REF_NAME`/`$ASSET` are not the env vars they look
        # like, silently expanding to empty strings instead of failing loudly.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber

  # release-binaries uploads 5 archives with nothing to verify them against.
  # Matrix jobs run in isolation and can't see each other's output, so this
  # can't be a sixth matrix leg — it runs after all five, downloads what they
  # uploaded, and hashes it in one place.
  checksums:
    name: Generate SHA256SUMS
    needs: release-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets and hash them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*'
          # A re-run of this job (after a prior partial failure, say) would
          # re-download an already-uploaded SHA256SUMS alongside the
          # binaries. Excluding it from the input list before hashing
          # avoids a file hashing itself and the redirect target racing
          # its own glob.
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

  # The release was created as a draft (see create-release) specifically so
  # every binary upload above lands before GitHub's immutable-releases
  # feature locks it — publishing (un-drafting) only happens here, once,
  # after every matrix job in release-binaries has finished uploading its
  # asset. Publishing early would let the very first successful upload race
  # ahead of the rest and lock the release before the others get a chance.
  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Undraft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
