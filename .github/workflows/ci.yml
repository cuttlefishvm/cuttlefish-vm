name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Compile and Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Tests build the guest proc-blocks, so the wasm target must be
          # present on every platform in the matrix, not just Linux.
          targets: wasm32-unknown-unknown
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Type Checking
        run: cargo check --workspace --all-targets --locked --verbose
      - name: Build
        run: cargo build --workspace --locked --verbose
      - name: Test
        run: cargo test --workspace --locked --verbose

  lints:
    name: Linting and Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Check Formatting
        run: cargo fmt --all --check --verbose
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-unknown-unknown
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Measurement only — no third-party upload. cargo-llvm-cov produces the
      # number locally, which is all a coverage figure ever required; the badge
      # is published from the docs workflow, which already owns gh-pages.
      #
      # `|| true` covers the legitimate case of a workspace with no test
      # binaries, where llvm-cov exits non-zero with "no coverage data found".
      # Replace this with a real `--fail-under-lines` threshold once there is
      # enough code for a number to mean something.
      - name: Coverage summary
        # `blocks/` is excluded because guest proc-blocks execute inside wasm,
        # where llvm-cov cannot instrument them — they report 0% however well
        # they are tested. Keep this regex identical to the one in docs.yml,
        # which generates the badge; a mismatch would make the badge and the CI
        # log disagree about the same codebase.
        run: |
          cargo llvm-cov --workspace --locked --summary-only \
            --ignore-filename-regex '(^|/)blocks/' || true

  # The `llamacpp` feature is off by default, so nothing above compiles it —
  # which is exactly how an optional feature rots unnoticed. This builds it on
  # one platform only: it compiles llama.cpp from source, and doing that three
  # times per run would dominate CI for a feature most users will not enable.
  #
  # Only the tests that need no model file run here. The ones that do are
  # `#[ignore]`d and read CUTTLEFISH_TEST_GGUF; run them locally against any
  # .gguf, including one Ollama has already pulled.
  llamacpp:
    name: Optional llama.cpp Feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # cuttlefish-host's tests build the wasm guest fixture, so this job
          # needs the target too — without it they fail deep inside a dependency
          # with "can't find crate for `std`", which points nowhere useful.
          targets: wasm32-unknown-unknown
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        # llama-cpp-sys-2 drives a cmake build and uses bindgen, which needs
        # libclang. Neither is needed for a default build.
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - name: Clippy
        run: cargo clippy -p cuttlefish-host --features llamacpp --all-targets --locked -- -D warnings
      - name: Test
        # Scoped to --lib plus the one integration binary that actually
        # touches this feature. The other 13 integration binaries under
        # tests/ are already covered by the baseline Compile and Test jobs
        # without the feature on -- running them again here too just pays
        # for the same from-scratch fixture-crate compiles (bundle_a,
        # det_a, res_a, ...) a second time for zero additional coverage.
        run: cargo test -p cuttlefish-host --features llamacpp --locked --lib --test llamacpp

  # `pdf-render` is off by default, so nothing above compiles it. It shipped
  # with three type errors for exactly that reason — a feature-gated path that
  # no build enables is a path that has never been compiled.
  pdf-render:
    name: Optional PDF Rendering Feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install pdfium
        # pdfium is loaded at runtime, not linked, so it has to be on disk and
        # findable via PDFIUM_DYNAMIC_LIB_PATH.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/pdfium"
          curl -fsSL https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7543/pdfium-linux-x64.tgz \
            | tar -xz -C "$HOME/pdfium"
          echo "PDFIUM_DYNAMIC_LIB_PATH=$HOME/pdfium/lib" >> "$GITHUB_ENV"
      - name: Clippy
        run: cargo clippy -p cuttlefish-host --features pdf-render --all-targets --locked -- -D warnings
      - name: Test
        # Same reasoning as the llamacpp job's Test step: scoped to --lib
        # plus tests/media.rs, the one integration binary with real
        # #[cfg(feature = "pdf-render")] tests. loud_failures.rs's
        # pdf-render-related assertion is for the feature being *off*, so
        # it's already exercised by the baseline jobs, not this one.
        run: cargo test -p cuttlefish-host --features pdf-render --locked --lib --test media

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep pinned to `rust-version` in the workspace Cargo.toml. If this job
      # fails, either fix the code or raise that field deliberately — bumping
      # this in isolation just hides the break from anyone on an older rustc.
      # The floor is imposed by wasmtime, which declares 1.94.0.
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: wasm32-unknown-unknown
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  # crates/cuttlefish-host/assets/rhai-interpreter.wasm is a checked-in
  # binary artifact, not built as part of an ordinary `cargo build
  # --workspace` (see its own doc comment in cuttlefish-host/src/lib.rs for
  # why `include_bytes!` requires this). That means it's possible to edit
  # blocks/rhai-interpreter's source and forget to regenerate/recommit the
  # asset — this job catches exactly that.
  #
  # Checks a SOURCE hash, not the wasm bytes — deliberately, after a real
  # failure: this job used to rebuild the interpreter and byte-compare the
  # result, which failed on the very first real run because a wasm build is
  # not reproducible across different rustc/LLVM versions, and this repo's
  # CI jobs (this one included) all use `dtolnay/rust-toolchain@stable` —
  # a materially different, independently-drifting toolchain from the
  # pinned one `scripts/rebuild-rhai-interpreter.sh` uses locally via `nix
  # develop`. Even `--remap-path-prefix` (ruling out embedded-absolute-path
  # drift) didn't fix it — the two toolchains just don't emit identical
  # code. Comparing
  # crates/cuttlefish-host/assets/rhai-interpreter.wasm.source-sha256 (a
  # hash of blocks/rhai-interpreter's own source, written by the same
  # rebuild script) against a freshly-computed hash of that same source
  # sidesteps toolchain reproducibility entirely — it only asks "does the
  # checked-in wasm still correspond to this exact source," and needs no
  # Rust toolchain at all to answer that.
  rhai-interpreter-asset-is-up-to-date:
    name: Rhai interpreter asset is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check source hash
        run: |
          set -euo pipefail
          expected="$(cat crates/cuttlefish-host/assets/rhai-interpreter.wasm.source-sha256)"
          actual="$(find blocks/rhai-interpreter -type f \( -name '*.toml' -o -name '*.rs' \) \
                     | sort | xargs cat | shasum -a 256 | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::crates/cuttlefish-host/assets/rhai-interpreter.wasm is stale — \
                  rebuild it with ./scripts/rebuild-rhai-interpreter.sh and commit the result \
                  (expected source hash $expected, blocks/rhai-interpreter's source now hashes \
                  to $actual)"
            exit 1
          fi

# API docs are built and published by .github/workflows/docs.yml. Since this
# project keeps its documentation in the code, that workflow is the docs build
# — it is deliberately separate so a docs failure is legible as such.
