name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Compile and Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Tests build the guest proc-blocks, so the wasm target must be
          # present on every platform in the matrix, not just Linux.
          targets: wasm32-unknown-unknown
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Type Checking
        run: cargo check --workspace --all-targets --locked --verbose
      - name: Build
        run: cargo build --workspace --locked --verbose
      - name: Test
        run: cargo test --workspace --locked --verbose

  lints:
    name: Linting and Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Check Formatting
        run: cargo fmt --all --check --verbose
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-unknown-unknown
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Measurement only — no third-party upload. cargo-llvm-cov produces the
      # number locally, which is all a coverage figure ever required; the badge
      # is published from the docs workflow, which already owns gh-pages.
      #
      # `|| true` covers the legitimate case of a workspace with no test
      # binaries, where llvm-cov exits non-zero with "no coverage data found".
      # Replace this with a real `--fail-under-lines` threshold once there is
      # enough code for a number to mean something.
      - name: Coverage summary
        # `blocks/` is excluded because guest proc-blocks execute inside wasm,
        # where llvm-cov cannot instrument them — they report 0% however well
        # they are tested. Keep this regex identical to the one in docs.yml,
        # which generates the badge; a mismatch would make the badge and the CI
        # log disagree about the same codebase.
        run: |
          cargo llvm-cov --workspace --locked --summary-only \
            --ignore-filename-regex '(^|/)blocks/' || true

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep pinned to `rust-version` in the workspace Cargo.toml. If this job
      # fails, either fix the code or raise that field deliberately — bumping
      # this in isolation just hides the break from anyone on an older rustc.
      # The floor is imposed by wasmtime, which declares 1.94.0.
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: wasm32-unknown-unknown
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

# API docs are built and published by .github/workflows/docs.yml. Since this
# project keeps its documentation in the code, that workflow is the docs build
# — it is deliberately separate so a docs failure is legible as such.
