name: API Docs

# Documentation for this project lives in the code as rustdoc (see AGENTS.md),
# so this workflow *is* the documentation build — there is no separate docs
# source tree to render.
#
# Output goes to this repo's `gh-pages` branch, which GitHub serves at
# https://cuttlefishvm.github.io/cuttlefish-vm — the URL the README and the
# crate's `homepage` already point at. Project pages for `cuttlefish-vm` in the
# `cuttlefishvm` org land under that path automatically, so this needs no
# cross-repo push and no personal access token; the default GITHUB_TOKEN is
# enough.
#
# Requires Pages to be enabled once, serving from branch `gh-pages`, root:
#   gh api -X POST repos/cuttlefishvm/cuttlefish-vm/pages \
#     -f 'source[branch]=gh-pages' -f 'source[path]=/'

on:
  pull_request:
  push:
    branches:
      - main
  # Lets a docs redeploy be triggered by hand, without an empty commit — useful
  # when Pages settings change and the site needs a fresh build to pick them up.
  workflow_dispatch:

env:
  # rustdoc emits the lib target's name with hyphens replaced by underscores.
  DEFAULT_CRATE_NAME: cuttlefish

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Stable, same as the rest of CI. This was nightly to enable
      # `doc_auto_cfg`, which Rust 1.92 removed — there is now nothing here that
      # needs an unstable compiler, and building docs on a different channel
      # than the tests only invites drift.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Runs on pull requests too, so a broken intra-doc link fails review
      # rather than silently shipping a dead reference. This is what makes the
      # "docs live in code" rule enforceable instead of aspirational.
      - name: Build docs
        run: cargo doc --workspace --no-deps --locked --verbose
        env:
          RUSTDOCFLAGS: -D warnings --cfg docsrs

      - name: Add landing redirect
        run: |
          echo '<meta http-equiv="refresh" content="0; url=${{ env.DEFAULT_CRATE_NAME }}/index.html" />' > target/doc/index.html
        shell: bash

      # The coverage badge is generated here rather than by a hosted service.
      # cargo-llvm-cov produces the percentage; this writes a shields.io
      # "endpoint" descriptor next to the docs, and the README points a badge at
      # it. No account, no upload token, and no coverage data leaving CI — the
      # only third party involved is shields.io rendering an SVG from a JSON
      # file we host ourselves.
      #
      # It lives in this workflow because this workflow already owns the
      # gh-pages branch. Publishing it from the CI workflow instead would mean
      # two workflows racing to push to the same branch.
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage badge
        shell: bash
        run: |
          set -uo pipefail
          # A workspace with no test binaries makes llvm-cov exit non-zero with
          # "no coverage data found". That is a real state — it is true right
          # now — not a failure worth blocking a docs deploy on, so it degrades
          # to an "unknown" badge instead.
          # `blocks/` is excluded deliberately. Guest proc-blocks execute inside wasm,
          # where llvm-cov's instrumentation cannot reach, so they report as 0%
          # regardless of how well they are tested — they are covered
          # behaviourally through the host's integration tests instead. Leaving
          # them in would make the figure track "how much guest code exists"
          # rather than "how much host logic is tested".
          # stderr goes to a file rather than /dev/null. A real crash here (not
          # "no tests exist") used to look identical to the empty-workspace
          # case — both degraded to the same silent "unknown" badge, with
          # nothing in the log to say which one happened. That is exactly the
          # kind of quiet failure this project's own rule (see AGENTS.md) says
          # not to ship: it hid a genuine bug — a nested `cargo build` in a
          # test failing under llvm-cov's RUSTC_WRAPPER — for several PRs.
          cov_log=$(mktemp)
          pct=$(cargo llvm-cov --workspace --locked --json --summary-only \
                  --ignore-filename-regex '(^|/)blocks/' 2>"$cov_log" \
                | python3 -c 'import sys, json; print(round(json.load(sys.stdin)["data"][0]["totals"]["lines"]["percent"], 1))' \
                2>>"$cov_log" || true)

          if [ -z "${pct:-}" ]; then
            echo "::warning::coverage badge falling back to 'unknown' — cargo llvm-cov produced no usable output. Log follows:"
            cat "$cov_log"
            msg="unknown"
            color="lightgrey"
          else
            msg="${pct}%"
            # Thresholds are deliberately unambitious: a red badge should mean
            # "genuinely untested", not "missed an aspiration".
            whole=${pct%.*}
            if   [ "$whole" -ge 80 ]; then color="brightgreen"
            elif [ "$whole" -ge 70 ]; then color="green"
            elif [ "$whole" -ge 50 ]; then color="yellow"
            elif [ "$whole" -ge 30 ]; then color="orange"
            else                           color="red"
            fi
          fi

          printf '{"schemaVersion":1,"label":"coverage","message":"%s","color":"%s"}\n' \
            "$msg" "$color" > target/doc/coverage.json
          echo "coverage badge: $msg ($color)"

      # rustdoc emits `static.files/`; without this Jekyll would try to process
      # the output and drop paths it treats as special.
      - name: Disable Jekyll processing
        run: touch target/doc/.nojekyll

      - name: Publish to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          branch: gh-pages
          folder: target/doc
          single-commit: true
