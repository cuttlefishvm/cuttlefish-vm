name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities do not belong here — please follow
        [SECURITY.md](../blob/main/SECURITY.md) instead.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Paste exact error output rather than paraphrasing it.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Smallest reproduction
      description: A spec file, block, and command that shows the problem.
    validations: { required: true }
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: "Output of `nix develop --command cargo --version`, plus your OS."
    validations: { required: true }
