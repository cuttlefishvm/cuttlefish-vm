[workspace]
resolver = "2"
# Members are listed explicitly rather than globbed as `crates/*`, because guest
# proc-blocks live in `blocks/` outside `crates/`, and a glob would silently miss
# them — a missing member surfaces later as a confusing "package not found".
# Add each new crate here as it lands.
members = [
    "crates/cuttlefish",     # facade + `cuttlefish` binary; the published crate
    "crates/cuttlefish-abi",  # wire types shared by host and guest
    "crates/cuttlefish-core", # spec parsing
    "crates/cuttlefish-sdk",  # guest-side block authoring
    "crates/cuttlefish-host", # wasmtime host + capability enforcement
    "crates/cuttlefishd",     # the daemon
    "blocks/echo-summarize",  # example block; publish = false
]

[workspace.package]
# Bumped in lockstep with the internal dependency versions below and with the
# release tag — .github/workflows/release.yml refuses to publish when the tag
# and this field disagree, because a tag that lies about what it published
# cannot be corrected afterwards.
version = "0.0.3"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cuttlefishvm/cuttlefish-vm.git"
homepage = "https://cuttlefishvm.github.io/"
authors = [
    "Michael-F-Bryan <michaelfbryan@gmail.com>",
    "Kartik Thakore <kartik@thakore.ai>",
]
# Kept in lockstep with the `msrv` job in .github/workflows/ci.yml. These are one
# decision recorded in two places; moving only the CI pin hides a break from
# everyone on an older compiler.
#
# The floor is not chosen, it is imposed: wasmtime 47 declares rust-version
# 1.94.0, so nothing below that can build. (reqwest wants 1.85, axum 1.78 — both
# are below the binding constraint.) Verify before lowering.
rust-version = "1.94"

# Dependency versions are pinned once here and inherited with
# `foo = { workspace = true }` so that the host, the daemon, and the guest SDK
# can never drift onto different versions of a shared type.
[workspace.dependencies]
# Internal crates carry BOTH a path and a version. The path is what the
# workspace builds against; the version is what a published crate records for
# its dependents. crates.io rejects a package whose dependency has only a path,
# so omitting the version breaks `cargo publish` and nothing else — the
# workspace builds fine right up until release day.
cuttlefish-abi = { path = "crates/cuttlefish-abi", version = "0.0.3" }
cuttlefish-core = { path = "crates/cuttlefish-core", version = "0.0.3" }
cuttlefish-sdk = { path = "crates/cuttlefish-sdk", version = "0.0.3" }
cuttlefish-host = { path = "crates/cuttlefish-host", version = "0.0.3" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }  # `sync` gates BroadcastStream
futures-util = "0.3"
wasmtime = "47"
# axum 0.8, not 0.7: its `serve` accepts any listener including a UnixListener,
# which is the whole reason this project needs no hand-rolled hyper accept loop.
# Note 0.8 also changed path syntax from `/jobs/:id` to `/jobs/{id}`.
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
# Content-addressing the block catalog's blob store (crates/cuttlefish-host/src/catalog.rs).
# Pinned to 0.10, not 0.11: 0.11's Digest::digest() returns a hybrid-array
# Array<u8, N> with no LowerHex/Display impl at all, so `format!("{:x}", ...)`
# does not compile against it. 0.10's GenericArray<u8, N> does implement
# LowerHex — confirmed by compiling both against this exact usage.
sha2 = "0.10"
# RFC 3339 timestamps for the catalog's index.json `created_at` field. Only the
# `formatting` feature — `created_at` is written once and compared as a plain
# string for ordering, never parsed back, so `parsing` isn't needed.
time = { version = "0.3", features = ["formatting"] }
# Cross-platform home-directory lookup for the CLI's default catalog root
# (~/.cuttlefish/catalog). Only used by crates/cuttlefish, not cuttlefish-host.
dirs = "6"
