# Coverage is a signal, not a gate. A correct change that happens to dip the
# percentage should not be blocked by a bot, so the status checks are advisory
# (`informational: true`) rather than failing.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  # Generated by the build, not authored.
  - "target/**"
  # Example proc-blocks are fixtures for the host's tests; they are exercised
  # through the wasm boundary, where llvm-cov cannot instrument them anyway.
  - "blocks/**"

comment:
  layout: "reach, diff, files"
  require_changes: true
